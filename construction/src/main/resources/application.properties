spring.application.name=construction


# ============================================
# Thymeleaf
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/static/
spring.thymeleaf.suffix=.html


# ============================================
# Static Resources
# ============================================
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**


# ============================================
# SQL Server
# ============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ConstructionDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=wbcms_user
spring.datasource.password=Wbcms@12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ============================================
# JWT Authentication
# ============================================
app.jwt.secret=MyVerySecretConstructionManagementSystemKey123456789
app.jwt.expiration-ms=86400000


# ============================================
# Spring AI
# ============================================
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-placeholder}
spring.ai.model.chat=none